services:
  enterprise-message-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: enterprise-message-bot:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      COMPANIES_REGISTRY_URL: ${COMPANIES_REGISTRY_URL:-https://gdb.guichet.investbenin.bj/#/app/data/pm/latest/view/3/latest}
      ESTABLISHMENTS_REGISTRY_URL: ${ESTABLISHMENTS_REGISTRY_URL:-https://gdb.monentreprise.bj/#/app/data/registre%20pp/latest/view/68/latest}
      COMPANIES_DATA_API_URL: ${COMPANIES_DATA_API_URL:-https://gdb.guichet.investbenin.bj/data-view/pm/latest/5}
      ESTABLISHMENTS_DATA_API_URL: ${ESTABLISHMENTS_DATA_API_URL:-https://gdb.monentreprise.bj/data-view/registre%20pp/latest/310}
      HEADLESS: "true"
      CHROME_PATH: /usr/bin/chromium
      BROWSER_DATA_DIR: /app/data/browser-profile
      NAVIGATION_TIMEOUT_SECONDS: ${NAVIGATION_TIMEOUT_SECONDS:-35}
      PAGE_SETTLE_SECONDS: ${PAGE_SETTLE_SECONDS:-2}
      ACTION_DELAY_SECONDS: ${ACTION_DELAY_SECONDS:-1}
      MCP_TRANSPORT: sse
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8283
      MCP_API_KEY: ${MCP_API_KEY:?MCP_API_KEY must be configured}
      DATABASE_URL: ""
      DATABASE_HOST: enterprise-postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-enterprise_bot}
      DATABASE_USER: ${POSTGRES_USER:-enterprise_bot}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-solvexsolution.org@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-solvexsolution.org@gmail.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Solvex Solution}
      SMTP_USE_STARTTLS: ${SMTP_USE_STARTTLS:-true}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-disabled}
      EVOLUTION_API_BASE_URL: ${EVOLUTION_API_BASE_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_API_INSTANCE: ${EVOLUTION_API_INSTANCE:-Solvexsolution}
      EVOLUTION_API_DELAY_MS: ${EVOLUTION_API_DELAY_MS:-123}
      EVOLUTION_API_LINK_PREVIEW: ${EVOLUTION_API_LINK_PREVIEW:-true}
      ENTERPRISE_MESSAGE_HOST: ${ENTERPRISE_MESSAGE_HOST:-}
      EVOLUTION_WEBHOOK_URL: ${EVOLUTION_WEBHOOK_URL:-}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET:-}
      WAHA_API_BASE_URL: ${WAHA_API_BASE_URL:-}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_DEFAULT_SESSION: ${WAHA_DEFAULT_SESSION:-default}
      WAHA_SESSIONS: ${WAHA_SESSIONS:-default}
      WAHA_WEBHOOK_URL: ${WAHA_WEBHOOK_URL:-}
      WAHA_WEBHOOK_SECRET: ${WAHA_WEBHOOK_SECRET:-}
      WAHA_POLLING_ENABLED: ${WAHA_POLLING_ENABLED:-true}
      WAHA_POLL_INTERVAL_SECONDS: ${WAHA_POLL_INTERVAL_SECONDS:-5}
      FIDELAPP_PRESENTATION_PATH: ${FIDELAPP_PRESENTATION_PATH:-/app/assets/FidelApp_Presentation_Commerciale_Canva.pptx}
      PHONE_COUNTRY_CODE: ${PHONE_COUNTRY_CODE:-229}
      PHONE_NATIONAL_PREFIX: ${PHONE_NATIONAL_PREFIX:-01}
    expose:
      - "8283"
    volumes:
      - enterprise-browser-data:/app/data
    shm_size: 1gb
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8283/health | grep -q '\"status\": \"ok\"' || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - enterprise-internal
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.enterprise-message-mcp.rule=Host(`${ENTERPRISE_MESSAGE_HOST:-bot-entreprise.localhost}`)"
      - "traefik.http.routers.enterprise-message-mcp.entrypoints=websecure"
      - "traefik.http.routers.enterprise-message-mcp.tls=true"
      - "traefik.http.routers.enterprise-message-mcp.service=enterprise-message-mcp"
      - "traefik.http.services.enterprise-message-mcp.loadbalancer.server.port=8283"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - /opt/enterprise-message/postgres-entrypoint.sh
    command:
      - postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_bot}
      POSTGRES_USER: ${POSTGRES_USER:-enterprise_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured}
    volumes:
      - enterprise-postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-entrypoint.sh:/opt/enterprise-message/postgres-entrypoint.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/postgres-password-synced && pg_isready -U ${POSTGRES_USER:-enterprise_bot} -d ${POSTGRES_DB:-enterprise_bot}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      enterprise-internal:
        aliases:
          - enterprise-postgres
    labels:
      - "traefik.enable=false"

volumes:
  enterprise-browser-data:
  enterprise-postgres-data:

networks:
  enterprise-internal:
    driver: bridge
    internal: true
  dokploy-network:
    name: dokploy-network
    external: true
